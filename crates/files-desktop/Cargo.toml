[package]
name = "files-desktop"
description = "How files meets the desktop: the file manager service, its actions for agents, UDisks2 disks, one running instance, and opening files with apps."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `FakeSpawn`, `FakeActivate` and `FakeUsers`, for tests of the crates above.
testing = []

[dependencies]
docket-wire = { workspace = true }
docket-manifest = { workspace = true }
docket-vocab = { workspace = true }
porter-ids = { workspace = true }
docket-provider = { workspace = true }
docket-core = { workspace = true }
docket-dbus = { workspace = true }
ds-helpers = { workspace = true }
files-core = { workspace = true }
files-fs = { workspace = true }
futures-util = { workspace = true }
porter-core = { workspace = true }
porter-dbus = { workspace = true }
ferry-bus = { workspace = true }
prov = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
zbus = { workspace = true }

[dev-dependencies]
files-desktop = { path = ".", features = ["testing"] }
files-fs = { workspace = true, features = ["testing"] }
# Porter's fake Storage1, served on the tests' private bus (test tooling, never shipped).
syncd-fakes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it/main.rs"
