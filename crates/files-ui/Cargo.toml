[package]
name = "files-ui"
description = "The window of files: a Finder-like folder view drawn only with quire's components."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chordkit = { workspace = true }
chrono = { workspace = true }
dioxus = { workspace = true }
ds = { workspace = true }
ds-blitz = { workspace = true }
ds-settings = { workspace = true, features = ["dioxus"] }
files-core = { workspace = true }
files-fs = { workspace = true }
files-model = { workspace = true }
files-ops = { workspace = true }
files-trash = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
ds-harness = { workspace = true }
ds-lint = { workspace = true }
files-fs = { workspace = true, features = ["testing"] }
files-trash = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it/main.rs"
