[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.92"
repository = "https://github.com/PoHsuanLai/files"
publish = false

# The layer table in scripts/check-boundary.sh says which of these may name which.
[workspace.dependencies]
files-core = { path = "crates/files-core" }
files-mime = { path = "crates/files-mime" }
files-model = { path = "crates/files-model" }
files-fs = { path = "crates/files-fs" }
files-trash = { path = "crates/files-trash" }
files-ops = { path = "crates/files-ops" }
files-desktop = { path = "crates/files-desktop" }
files-ui = { path = "crates/files-ui" }
# quire, pinned the desktop-wide way (.git + full rev; the tag is a comment), as temor and anyview do.
ds = { git = "https://github.com/PoHsuanLai/quire.git", rev = "10ee7011a0b781876377a6a017362a066d0f10f1" }  # 10ee7011: v0.3.44
ds-blitz = { git = "https://github.com/PoHsuanLai/quire.git", rev = "10ee7011a0b781876377a6a017362a066d0f10f1" }  # 10ee7011: v0.3.44
ds-settings = { git = "https://github.com/PoHsuanLai/quire.git", rev = "10ee7011a0b781876377a6a017362a066d0f10f1" }  # 10ee7011: v0.3.44
ds-harness = { git = "https://github.com/PoHsuanLai/quire.git", rev = "10ee7011a0b781876377a6a017362a066d0f10f1" }  # 10ee7011: v0.3.44
ds-lint = { git = "https://github.com/PoHsuanLai/quire.git", rev = "10ee7011a0b781876377a6a017362a066d0f10f1" }  # 10ee7011: v0.3.44
# The desktop's portable keymap core (actions, chords, Primary per platform); files owns no keymap.
chordkit = { git = "https://github.com/PoHsuanLai/chordkit.git", rev = "99eec9ddd03ee345b669fcc7954ed44590724290" }
# anyview, the desktop's viewer: Quick Look is its light tier, `anyview-peek`'s worker and card, hosted as
# mailo hosts them (headless otherwise: no media player, no D-Bus). The rev is anyview's main, which names
# the quire rev above. `anyview-core` is the vocabulary (`FilePath`), `anyview-fs` opens a path as an input.
anyview-core = { git = "https://github.com/PoHsuanLai/anyview.git", rev = "92e98449478ee3941999cf624a3e80d5484fdf98" }  # 92e98449
anyview-fs = { git = "https://github.com/PoHsuanLai/anyview.git", rev = "92e98449478ee3941999cf624a3e80d5484fdf98" }  # 92e98449
anyview-image = { git = "https://github.com/PoHsuanLai/anyview.git", rev = "92e98449478ee3941999cf624a3e80d5484fdf98" }  # 92e98449
anyview-platform = { git = "https://github.com/PoHsuanLai/anyview.git", rev = "92e98449478ee3941999cf624a3e80d5484fdf98" }  # 92e98449
anyview-peek = { git = "https://github.com/PoHsuanLai/anyview.git", rev = "92e98449478ee3941999cf624a3e80d5484fdf98", default-features = false }  # 92e98449
# Copied from quire/docs/workspace-deps.toml at the rev above.
dioxus = { version = "0.7", default-features = false, features = ["macro", "html", "hooks", "signals"] }
# Dates in the list view, in the person's own time zone.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# The binary reads the XDG user folders (user-dirs.dirs) once.
dirs = "6"
notify = "8.2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
# files-desktop: the only crate that names docket or porter (scripts/check-boundary.sh), as
# temor-desktop is for temor. The rev is temor's, so docket and porter lock the same everywhere:
# docket 7c9b57cb locks porter b2adc64d (porter-core and prov), as temor does. docket-client is
# feature `dbus` only: no router, no cedar. No [patch] is needed for docket or porter.
docket-client = { git = "https://github.com/PoHsuanLai/docket.git", rev = "7c9b57cb41516f8e050e797852bc1cc3d18736f0", default-features = false, features = ["dbus"] }
docket-core = { git = "https://github.com/PoHsuanLai/docket.git", rev = "7c9b57cb41516f8e050e797852bc1cc3d18736f0" }
# Who may call Files' provider (intentd's unit), and the stand-in a test names for it.
docket-dbus = { git = "https://github.com/PoHsuanLai/docket.git", rev = "7c9b57cb41516f8e050e797852bc1cc3d18736f0" }
prov = { git = "https://github.com/PoHsuanLai/porter.git", rev = "b2adc64da9ce49b41c83c73888a7d4da9e57a8bf" }
porter-core = { git = "https://github.com/PoHsuanLai/porter.git", rev = "b2adc64da9ce49b41c83c73888a7d4da9e57a8bf" }
# The tests of files-desktop write the calls the router sends as JSON.
serde = "1"
serde_json = "1"
# Desktop entries (the parser and the walk of the applications folders), UI-free without its default feature.
ds-helpers = { git = "https://github.com/PoHsuanLai/quire.git", rev = "10ee7011a0b781876377a6a017362a066d0f10f1", default-features = false }  # 10ee7011 (v0.3.44)
tempfile = "3"
# The binary finds an app's icon file in the person's icon theme (detent's version). MIT.
freedesktop-icons = "0.4"
# The disk service's signals are read as a stream (files-desktop only).
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# The remembered folder views (files-fs): a TOML file the app owns, read and written as text.
toml = "1"
thiserror = "2"
# The freedesktop.org Trash (files-trash only): MIT, pure Rust on Linux.
trash = "5"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"

# Matching on our own enums names every variant, so adding one is a compile error wherever it
# matters. Tests may unwrap (clippy.toml).
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"

# Line tables only, as quire, sill and anyview build: backtraces keep file and line, and test
# binaries link in a fraction of the memory and disk.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Patches apply only at a workspace root, so this root repeats quire's block verbatim.
# vello and anyrender come from our forks (github.com/PoHsuanLai/vello and /anyrender, branch
# quire-filters): the colour matrix filter, multi-threaded filter layers and CSS filter lists, so
# every CSS `filter` function paints on both backends. Move back to crates.io once upstream has
# them (blitz-kit docs/blitz-gaps.md tracks the PRs).
[patch.crates-io]
vello_common = { git = "https://github.com/PoHsuanLai/vello", rev = "84b2c9f7debed7d15f48d0ec9ea8575c16a56938" }
vello_cpu = { git = "https://github.com/PoHsuanLai/vello", rev = "84b2c9f7debed7d15f48d0ec9ea8575c16a56938" }
vello_hybrid = { git = "https://github.com/PoHsuanLai/vello", rev = "84b2c9f7debed7d15f48d0ec9ea8575c16a56938" }
vello_sparse_shaders = { git = "https://github.com/PoHsuanLai/vello", rev = "84b2c9f7debed7d15f48d0ec9ea8575c16a56938" }
glifo = { git = "https://github.com/PoHsuanLai/vello", rev = "84b2c9f7debed7d15f48d0ec9ea8575c16a56938" }
anyrender = { git = "https://github.com/PoHsuanLai/anyrender", rev = "d4ae3885f89a58351ff7e99cd75d9b7de5865337" }
anyrender_vello_cpu = { git = "https://github.com/PoHsuanLai/anyrender", rev = "d4ae3885f89a58351ff7e99cd75d9b7de5865337" }
anyrender_vello_hybrid = { git = "https://github.com/PoHsuanLai/anyrender", rev = "d4ae3885f89a58351ff7e99cd75d9b7de5865337" }
wgpu_context = { git = "https://github.com/PoHsuanLai/anyrender", rev = "d4ae3885f89a58351ff7e99cd75d9b7de5865337" }
pixels_window_renderer = { git = "https://github.com/PoHsuanLai/anyrender", rev = "d4ae3885f89a58351ff7e99cd75d9b7de5865337" }
# dioxus-core 0.7.10 can spin forever in VirtualDom::wait_for_work: a task woken and then cancelled
# before it is polled (a use_resource restart) leaves an empty entry in the dirty-task queue that
# pop_task never removes. Fixed upstream in DioxusLabs/dioxus#5554 (0.8-alpha only); this fork
# (github.com/PoHsuanLai/dioxus, branch quire-0.7) backports it onto 0.7.10. Remove when quire
# moves to dioxus 0.8.
dioxus-core = { git = "https://github.com/PoHsuanLai/dioxus", rev = "a615fd9f09e272c688a45e366161c576cecf0439" }
dioxus-core-types = { git = "https://github.com/PoHsuanLai/dioxus", rev = "a615fd9f09e272c688a45e366161c576cecf0439" }
generational-box = { git = "https://github.com/PoHsuanLai/dioxus", rev = "a615fd9f09e272c688a45e366161c576cecf0439" }
subsecond = { git = "https://github.com/PoHsuanLai/dioxus", rev = "a615fd9f09e272c688a45e366161c576cecf0439" }
subsecond-types = { git = "https://github.com/PoHsuanLai/dioxus", rev = "a615fd9f09e272c688a45e366161c576cecf0439" }
